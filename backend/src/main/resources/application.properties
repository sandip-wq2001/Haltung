spring.application.name=haltung-backend
server.port=8000

# Bind to the loopback interface only. Without this Spring listens on 0.0.0.0, so anyone on the
# same network could read or overwrite calibration profiles. CORS does not help — it constrains
# browsers, not curl or any other non-browser client. The project's privacy guarantee is that
# nothing leaves the machine, and this is what actually enforces it.
server.address=127.0.0.1

# H2 in file mode: a real embedded database that lives on the user's own disk. Nothing leaves
# the machine, so the privacy invariant holds.
spring.datasource.url=jdbc:h2:file:./data/haltung;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
